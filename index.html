<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0e1f">
  <title>คลังบอร์ดเกม · Board Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/common.css">
  <style>
    body {
      --text: #eef0ff; --muted: #a3a8d3; --accent: #f5c46b; --border: rgba(255, 255, 255, .1);
      color: var(--text); min-height: 100vh;
      background: radial-gradient(900px 600px at 85% -10%, #3a2f6b 0%, transparent 60%),
                  radial-gradient(700px 500px at -10% 110%, #1d4a5a 0%, transparent 60%),
                  linear-gradient(180deg, #161a3a, #0b0e1f 70%);
      background-attachment: fixed;
    }
    header { padding: 36px 0 8px; text-align: center; }
    .logo { font-size: 64px; line-height: 1; filter: drop-shadow(0 10px 24px rgba(0, 0, 0, .5)); }
    header h1 {
      margin: 10px 0 0; font: 500 38px/1.3 "Mitr", sans-serif;
      background: linear-gradient(180deg, #fff, #f5c46b); -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    header p { margin: 6px auto 0; color: var(--muted); max-width: 440px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; margin-top: 28px; }
    .card {
      position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 4px;
      border-radius: 22px; padding: 20px; text-decoration: none; color: inherit;
      background: rgba(28, 33, 68, .7); border: 1px solid var(--border);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
      transition: transform .2s, border-color .2s, box-shadow .2s;
    }
    .card::before {
      content: ""; position: absolute; inset: 0 0 auto 0; height: 120px; opacity: .55; pointer-events: none;
      background: radial-gradient(260px 120px at 30% 0%, var(--glow, #6f7dff), transparent 70%);
    }
    a.card:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: 0 16px 40px rgba(0, 0, 0, .45); }
    .card > * { position: relative; }
    .card .icon { font-size: 56px; line-height: 1.1; margin: 4px 0 6px; }
    .card h2 { margin: 0; font: 500 24px/1.3 "Mitr", sans-serif; }
    .card .meta { color: var(--muted); font-size: 14px; }
    .card p { margin: 6px 0 0; font-size: 15px; color: #d4d7f5; }
    .card .play {
      margin-top: 14px; align-self: flex-start; padding: 8px 18px; border-radius: 99px; font-weight: 700;
      background: linear-gradient(135deg, #f5c46b, #e88a3c); color: #241603;
    }
    .card.soon { opacity: .5; }
    .en-line { display: block; font-size: .8em; font-style: italic; opacity: .7; margin-top: 2px; }
    .tag {
      position: absolute; top: 16px; right: 16px; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 99px;
      background: rgba(255, 255, 255, .1); color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">🎲</div>
      <h1>คลังบอร์ดเกม</h1>
      <p>เกมปาร์ตี้เล่นกับเพื่อน สร้างห้องแล้วให้ทุกคนเข้าด้วยมือถือตัวเอง — ไม่ต้องมีคนคุมเกม
        <span class="en-line">Party games with friends — create a room and everyone joins on their own phone. No game master needed.</span></p>
    </header>
    <div class="grid" id="games"></div>
  </div>
  <script>
    const GAMES = [
      { icon: '🐺', name: 'มนุษย์หมาป่า', en: 'Werewolf', players: '5–20 คน · players', time: '20–60 นาที · min', glow: '#ff5d6c',
        desc: 'ตามล่าหมาป่าที่แฝงตัวในหมู่บ้าน มีบทบาทกว่า 30 แบบ พร้อมเสียงพากย์ไทยดำเนินกลางวัน–กลางคืนให้อัตโนมัติ',
        descEn: 'Hunt the werewolves hiding in the village. 30+ roles, with Thai/English narration running day and night for you.',
        href: 'games/werewolf/' },
      { icon: '🤫', name: 'คำต้องห้าม', en: 'Forbidden Words', players: '3–20 คน · players', time: '5–30 นาที · min', glow: '#ff5fa2',
        desc: 'ทุกคนเห็นคำต้องห้ามของเพื่อน แต่ไม่รู้คำของตัวเอง คุยเล่นแล้วหลอกให้เพื่อนพูดออกมาให้ได้!',
        descEn: 'Everyone sees their friends\' forbidden words but not their own. Chat and trick them into saying theirs!',
        href: 'games/forbidden/' },
      { icon: '🧀', name: 'หนูขโมยชีส', en: 'Cheese Thief', players: '4–10 คน · players', time: '10–15 นาที · min', glow: '#ffc94a',
        desc: 'ทุกคนตื่นตามเลขลูกเต๋า ใครตื่นพร้อมหัวขโมยจะเห็นมันขโมยชีส! ตอนเช้าช่วยกันหาตัวคนร้าย พร้อมเสียงพากย์',
        descEn: 'Everyone wakes at their die\'s hour — wake with the thief and you see the cheese stolen! Find the thief by morning. With narration.',
        href: 'games/cheese/' },
      { icon: '🕵️', name: 'สายลับ', en: 'Spyfall', players: '3–12 คน · players', time: '5–15 นาที · min', glow: '#5fd49a',
        desc: 'ทุกคนรู้ว่าอยู่ที่ไหน ยกเว้นสายลับหนึ่งคน ถามตอบกันจับสายลับให้ได้ ก่อนเขาจะเดาสถานที่ออก!',
        descEn: 'Everyone knows the location except the spy. Ask and answer to catch the spy before they guess where you are!',
        href: 'games/spyfall/' },
      { icon: '🃏', name: 'อูโน่', en: 'UNO', players: '2–10 คน · players', time: '10–30 นาที · min', glow: '#ff4d4d',
        desc: 'ลงไพ่ตามสีหรือตัวเลข ป่วนเพื่อนด้วย +2 +4 ข้าม กลับทาง ไพ่อยู่บนมือถือตัวเอง อย่าลืมกด UNO!',
        descEn: 'Match the color or number, mess with friends using +2, +4, skip and reverse. Your hand is on your phone — don\'t forget UNO!',
        href: 'games/uno/' },
      { icon: '⚔️', name: 'อวาลอน', en: 'Avalon', players: '5–10 คน · players', time: '30 นาที · min', glow: '#9fb1ff',
        desc: 'ภารกิจอัศวินกับสมุนมอร์เดรดที่ซ่อนตัว', descEn: 'Knights on a quest, with Mordred\'s minions hidden among them.', href: null },
    ];
    document.getElementById('games').innerHTML = GAMES.map(g => {
      const inner = `${g.href ? '' : '<span class="tag">เร็ว ๆ นี้ · Soon</span>'}
        <div class="icon">${g.icon}</div><h2>${g.name}</h2>
        <div class="meta">${g.en} · ${g.players} · ${g.time}</div><p>${g.desc}<span class="en-line">${g.descEn}</span></p>
        ${g.href ? '<span class="play">▶ เล่นเลย · Play</span>' : ''}`;
      return g.href
        ? `<a class="card" style="--glow:${g.glow}" href="${g.href}">${inner}</a>`
        : `<div class="card soon" style="--glow:${g.glow}">${inner}</div>`;
    }).join('');
  </script>
</body>
</html>
